version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ubc_postgres_dev
    restart: always
    environment:
      POSTGRES_USER: ubc_user
      POSTGRES_PASSWORD: ubc_password
      POSTGRES_DB: ubc_db
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ubc_user -d ubc_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:

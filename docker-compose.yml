version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ubc_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ubc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ubc_password}
      POSTGRES_DB: ${POSTGRES_DB:-ubc_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ubc_user} -d ${POSTGRES_DB:-ubc_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ubc_api
    restart: always
    env_file:
      - ./apps/api/.env
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ubc_user}:${POSTGRES_PASSWORD:-ubc_password}@postgres:5432/${POSTGRES_DB:-ubc_db}
      NODE_ENV: production

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ubc_web
    restart: always
    env_file:
      - ./apps/web/.env
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      NODE_ENV: production

volumes:
  postgres_data:

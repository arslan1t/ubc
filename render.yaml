services:
  - type: web
    name: ubc-api
    env: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: "pnpm install --frozen-lockfile --prod=false && pnpm --filter=@ubc/api run build"
    startCommand: "pnpm --filter=@ubc/api exec prisma migrate deploy && node apps/api/dist/main"
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://ubc-web.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: ubc-db
          property: connectionString

databases:
  - name: ubc-db
    plan: free
    region: frankfurt
